<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plantutti — Panel CMS</title>
    <!-- Netlify Identity: obsluguje logowanie do panelu (Zuzanna zaprasza siebie/innych z panelu Netlify -> Identity) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Sveltia CMS: nowoczesny, lzejszy interfejs zgodny z formatem Decap CMS (ten sam config.yml) -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
    <script>
      // Przekierowanie po logowaniu/wylogowaniu (wymagane przez Netlify Identity + Git Gateway)
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/admin/';
            });
          }
        });
      }
    </script>
  </body>
</html>
